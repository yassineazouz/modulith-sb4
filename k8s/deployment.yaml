kind : Deployment
apiVersion : apps/v1
metadata : 
    name : modulith
    namespace: shop
    labels : 
      app : modulith




spec : 
  replicas : 1

  selector:
      matchLabels:
        app: modulith

  template:
      metadata:
        labels:
          app: modulith      
    
      spec : 
          containers : 
            - name : modulith
              image : demo-modulith-sb4:0.0.1
              imagePullPolicy: IfNotPresent
              ports : 
                - containerPort : 8080
              resources:
                requests:
                  cpu: "250m"
                  memory: "512Mi"
                limits:
                  memory: "768Mi"
